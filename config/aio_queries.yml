# 株式会社TCD (https://tcd.jp/) AIO日次モニタリング 設定ファイル
# WordPressテーマ販売のTCDではなく、ブランディング会社の株式会社TCDです
#
# aio_daily_monitor.py が毎日読み込む設定。
# config/aio_monitor.yml（週次・月次レポート用）とは別に、
# 日次モニタリング専用のクエリ・設定をここで管理する。

# ──────────────────────────────────────────
# 日次観測対象クエリ
# ──────────────────────────────────────────
queries:
  - "ブランディングとは"
  - "ブランディング 会社"
  - "ブランディング 会社 東京"
  - "ブランディング 会社 大阪"
  - "インナーブランディングとは"
  - "インナーブランディング 会社"
  - "インナーブランディング 会社 東京"
  - "インナーブランディング 会社 大阪"

# ──────────────────────────────────────────
# SerpAPI 検索パラメータ
# ──────────────────────────────────────────
serpapi:
  engine: "google"
  google_domain: "google.co.jp"
  hl: "ja"
  gl: "jp"
  location: "Japan"

# ──────────────────────────────────────────
# TCD判定用ドメイン（引用URLのホスト名がこのドメイン、またはそのサブドメインなら tcd_cited）
# ──────────────────────────────────────────
tcd_domain: "tcd.jp"

# ──────────────────────────────────────────
# TCD社名判定（AIO本文での言及・推薦）
# 「株式会社TCD」「（株）TCD」「TCD Corporation」「tcd.jp」は単独で判定する。
# 「TCD」単独の表記は、同じ行に context_terms のいずれかがあり、
# exclude_terms（WordPressテーマ「TCD」＝株式会社デザインプラス 等）がない場合のみ判定する。
# ──────────────────────────────────────────
tcd_entity:
  context_terms: ["ブランディング", "ブランド", "銀座", "芦屋", "50年", "1971"]
  exclude_terms: ["WordPress", "ワードプレス", "テーマ", "デザインプラス", "Design Plus", "DesignPlus", "tcd-theme"]

# ──────────────────────────────────────────
# TCD推薦判定
# query_keywords を含むクエリだけを推薦判定の対象とする（それ以外は not_applicable）。
# 本文から会社名（法人格つきの表記、または known_company_names）を1社以上検出できた場合のみ
# 「会社一覧を取得できた」とみなし、TCDが登場しなければ not_recommended とする。
# 会社名を1社も検出できない場合は undeterminable（推薦判定不可）。
# ──────────────────────────────────────────
recommendation:
  query_keywords: ["会社"]
  known_company_names:
    - "パラドックス"
    - "セブンデックス"
    - "エイトブランディングデザイン"
    - "EIGHT BRANDING DESIGN"
    - "グラムコ"
    - "GRAMCO"
    - "ID INC."
    - "パドルデザインカンパニー"
    - "イマジナ"
    - "MIMIGURI"
    - "Takram"
    - "グッドパッチ"
    - "Goodpatch"
    - "揚羽"
    - "リンクアンドモチベーション"
    - "スピッカート"
    - "Move Emotions"

# ──────────────────────────────────────────
# AIO引用元ドメイン正規化
# SerpAPIの引用元表記（ドメイン／日本語社名／英語表記）が
# 同一企業でも分裂して集計されないよう、正規化後のドメインに寄せる
# key: 正規化後のドメイン（正規化先）
# value: 表記ゆれのリスト（ドメイン・社名・英語表記など）
# ──────────────────────────────────────────
domain_aliases:
  paddledesign.co.jp:
    - "paddledesign.co.jp"
    - "パドルデザインカンパニー"
    - "株式会社パドルデザインカンパニー"
    - "Paddle Design"
  # 以下は data_v2/raw/aio の生レスポンスで「表示名 → リンク先ホスト」の対応を確認したもの（2026-10-19）。
  # リンクが google.co.jp/goto 等で遷移先が分からない引用元も、表示名からドメインへ寄せるために使う。
  tcd.jp: ["株式会社TCD"]
  prdx.co.jp: ["株式会社パラドックス"]
  sevendex.com: ["株式会社セブンデックス"]
  8brandingdesign.com: ["EIGHT BRANDING DESIGN"]
  goodpatch.com: ["Goodpatch"]
  okanechips.mei-kyu.com: ["おかねチップス"]
  web-kanji.com: ["Web幹事"]
