# 株式会社TCD (https://tcd.jp/) AIO日次モニタリング 設定ファイル
# WordPressテーマ販売のTCDではなく、ブランディング会社の株式会社TCDです
#
# aio_daily_monitor.py が毎日読み込む設定。
# config/aio_monitor.yml（週次・月次レポート用）とは別に、
# 日次モニタリング専用のクエリ・設定をここで管理する。

# ──────────────────────────────────────────
# 日次観測対象クエリ
# ──────────────────────────────────────────
queries:
  - "ブランディングとは"
  - "ブランディング 会社"
  - "ブランディング 会社 東京"
  - "ブランディング 会社 大阪"
  - "インナーブランディングとは"
  - "インナーブランディング 会社"
  - "インナーブランディング 会社 東京"
  - "インナーブランディング 会社 大阪"

# ──────────────────────────────────────────
# SerpAPI 検索パラメータ
# ──────────────────────────────────────────
serpapi:
  engine: "google"
  google_domain: "google.co.jp"
  hl: "ja"
  gl: "jp"
  location: "Japan"

# ──────────────────────────────────────────
# TCD判定用ドメイン（このドメインを含むかどうかで tcd_cited / tcd_mentioned を判定）
# ──────────────────────────────────────────
tcd_domain: "tcd.jp"

# ──────────────────────────────────────────
# AIO引用元ドメイン正規化
# SerpAPIの引用元表記（ドメイン／日本語社名／英語表記）が
# 同一企業でも分裂して集計されないよう、正規化後のドメインに寄せる
# key: 正規化後のドメイン（正規化先）
# value: 表記ゆれのリスト（ドメイン・社名・英語表記など）
# ──────────────────────────────────────────
domain_aliases:
  paddledesign.co.jp:
    - "paddledesign.co.jp"
    - "パドルデザインカンパニー"
    - "株式会社パドルデザインカンパニー"
    - "Paddle Design"
