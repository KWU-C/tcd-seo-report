# 株式会社TCD (https://tcd.jp/) SEO/AIO 月次レポート 設定ファイル
# WordPressテーマ販売のTCDではなく、ブランディング会社の株式会社TCDです

site_url: "https://tcd.jp/"

# 監視ページリスト（CSV で一元管理）
watching_csv: "Watching.csv"

# ──────────────────────────────────────────
# 重点キーワード
# 半角スペース・全角スペース・スペースなしのバリアントは
# スクリプト側でスペースを除去して正規化照合します
# ──────────────────────────────────────────
key_keywords:
  - "ブランディングとは"
  - "ブランディング 会社"
  - "ブランディング 会社 東京"
  - "ブランディング 会社 大阪"
  - "インナーブランディングとは"
  - "インナーブランディング 会社"
  - "インナーブランディング 会社 東京"
  - "インナーブランディング 会社 大阪"

# ──────────────────────────────────────────
# ページ監視リストは Watching.csv で管理
# ──────────────────────────────────────────
# LP / CV ページ
# 末尾スラッシュ有無はスクリプト側で両方照合します
# ──────────────────────────────────────────
lp_cv_pages:
  - url: "https://tcd.jp/"
    name: "トップページ"
    type: "lp"
  - url: "https://tcd.jp/contact"
    name: "お問い合わせ"
    type: "cv"
  - url: "https://tcd.jp/download"
    name: "資料ダウンロード"
    type: "cv"

# ──────────────────────────────────────────
# AIO引用元ドメイン正規化
# SerpAPIの引用元表記（ドメイン／日本語社名／英語表記）が
# 同一企業でも分裂して集計されないよう、正規化後のドメインに寄せる
# key: 正規化後のドメイン（正規化先）
# value: 表記ゆれのリスト（ドメイン・社名・英語表記など）
# ──────────────────────────────────────────
domain_aliases:
  paddledesign.co.jp:
    - "paddledesign.co.jp"
    - "パドルデザインカンパニー"
    - "株式会社パドルデザインカンパニー"
    - "Paddle Design"
  zeroin.co.jp:
    - "zeroin.co.jp"
    - "株式会社ゼロイン"
  shanon.co.jp:
    - "shanon.co.jp"
    - "株式会社シャノン"
  prdx.co.jp:
    - "prdx.co.jp"
    - "株式会社パラドックス"
  ageha.tv:
    - "ageha.tv"
    - "株式会社揚羽"
    - "株式会社揚羽（AGEHA Inc.）"
    - "AGEHA Inc."
  irischitose.co.jp:
    - "irischitose.co.jp"
    - "アイリスチトセ株式会社"

# ──────────────────────────────────────────
# AIO引用元ドメインのエンティティ分類
# 集計キー（正規化後ドメイン）ごとに手動で分類する。
# 未登録のドメインは "unknown" として扱われる（AIO参考情報源に分類される）。
# entity_type: branding_company / consulting_company / client_company /
#              media / public_institution / financial_institution / platform / unknown
# ──────────────────────────────────────────
domain_entity_types:
  tcd.jp: "branding_company"
  paddledesign.co.jp: "branding_company"
  prdx.co.jp: "branding_company"
  ageha.tv: "branding_company"
  zeroin.co.jp: "consulting_company"
  smbc.co.jp: "financial_institution"
  mirasapo-plus.go.jp: "public_institution"
  prtimes.com: "media"

# ──────────────────────────────────────────
# Google AI Overview 観測設定
# playwright がインストールされている場合のみ実行
# ──────────────────────────────────────────
google_aio:
  enabled: true
  queries:
    - "ブランディング 会社"
    - "ブランディング 会社 東京"
    - "ブランディング 会社 大阪"
    - "インナーブランディング 会社"
    - "インナーブランディング 会社 東京"
    - "インナーブランディング 会社 大阪"
  engine: "google"
  google_domain: "google.co.jp"
  hl: "ja"
  gl: "jp"
  location: "Japan"

# ──────────────────────────────────────────
# 定点SERP観測（毎週・固定4キーワード）
# google_aio.queries のうち下記4件について
# 「誰が増えたか／AIOの有無／引用元が変わったか」を前週分と比較する
# ──────────────────────────────────────────
point_watch_queries:
  - "ブランディング 会社 東京"
  - "ブランディング 会社 大阪"
  - "インナーブランディング 会社 東京"
  - "インナーブランディング 会社 大阪"

# ──────────────────────────────────────────
# 市場存在感サマリー（レポート冒頭）
# 対象市場ごとにSEO順位・AIO引用の週次方向性を1行サマリーで表示する。
# key_keywords / google_aio.queries と重複するクエリを指定する。
# ──────────────────────────────────────────
market_presence_queries:
  - "ブランディング 会社"
  - "インナーブランディング 会社"
  - "ブランディング 会社 東京"
  - "インナーブランディング 会社 東京"
  - "ブランディング 会社 大阪"
  - "インナーブランディング 会社 大阪"

# ──────────────────────────────────────────
# 新規・更新ページのインデックス監視
# 公開・更新した記事をここに追加すると、
# Search Console上での表示開始状況をレポートで追跡します
# ──────────────────────────────────────────
new_index_watch:
  - url: "https://tcd.jp/branding/03-news/osaka-branding-company.html"
    title: "大阪でブランディング会社を選ぶ前に"
    published_or_updated_date: "2026-07-07"
  # 記入例:
  # - url: "/branding/definition/example.html"
  #   title: "記事タイトル"
  #   published_or_updated_date: "2026-07-01"

# ──────────────────────────────────────────
# ページ単体クエリ分析（地域ページ判定・AIOハブ候補判定）
# 指定ページに page フィルタで絞り込んだ検索クエリを毎週追跡する。
# regional_terms に該当するクエリは「地域ページ」認識の判定に、
# それ以外の一般語・比較語・自然文クエリは「AIOハブ候補」判定に使う。
# ──────────────────────────────────────────
page_query_watch:
  classification:
    regional_terms: ["大阪", "関西"]
    comparison_terms: ["比較", "選び方", "違い", "おすすめ", "大手", "実績", "どちら", "どこ", "会社"]
    natural_language_min_length: 20
  reference_days: 90
  pages:
    - slug: "osaka"
      label: "大阪ページ"
      url: "https://tcd.jp/branding/03-news/osaka-branding-company.html"
    # 記入例（公開後に追加）:
    # - slug: "tokyo"
    #   label: "東京ページ"
    #   url: "https://tcd.jp/branding/03-news/tokyo-branding-company.html"

# ──────────────────────────────────────────
# レポート設定
# ──────────────────────────────────────────
report:
  top_n: 20
  aio_min_impressions: 50
  aio_alert_threshold: 0.4
