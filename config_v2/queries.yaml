    paddledesign.co.jp:
      - "paddledesign.co.jp"
      - "パドルデザインカンパニー"
      - "株式会社パドルデザインカンパニー"
      - "Paddle Design"
    zeroin.co.jp:
      - "zeroin.co.jp"
      - "株式会社ゼロイン"
    shanon.co.jp:
      - "shanon.co.jp"
      - "株式会社シャノン"
    prdx.co.jp:
      - "prdx.co.jp"
      - "株式会社パラドックス"
    ageha.tv:
      - "ageha.tv"
      - "株式会社揚羽"
      - "株式会社揚羽（AGEHA Inc.）"
      - "AGEHA Inc."
    irischitose.co.jp:
      - "irischitose.co.jp"
      - "アイリスチトセ株式会社"
  entity_types:
    tcd.jp: branding_company
    paddledesign.co.jp: branding_company
    prdx.co.jp: branding_company
    ageha.tv: branding_company
