# 監視対象マスタ（固定ページのみ）
#
# 出典: Page-List - シート1.csv（ユーザー管理の正本）
# このファイルは「ページ一覧」ではなく「監視対象マスタ」。
# 以後のレポート生成・分析はコードにURLをハードコードせず、本ファイルを参照すること。
#
# group:     service | branding   … Page-List.csv の「カテゴリ」列に対応
# category:  service | definition … Page-List.csv の「ページ種」列に対応
#            ※ landing（マガジン上位ランディングページ）はここに含めない。
#              固定リストではなく毎週のSearch Consoleデータから動的抽出する対象のため、
#              設計上あえて本マスタから分離している。
# priority:  運用で変わるため固定管理しない。未設定は null。
# enabled:   true | false（現時点では全ページ true）
# objective: ページ群ごとの分析軸（複数可）。既定は group/category から付与し、
#            個別ページで実態と異なる場合は明示的に上書きする（例: 大阪ページ）。
#
# id は URL のパス末尾（拡張子除く）から機械的に生成。ハイフン/アンダースコアは
# 元URL表記のまま保持し、自動的な同一視は行わない。

