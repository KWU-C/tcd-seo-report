# 問い合わせ実績（週次レポート「② 問い合わせ実績」の入力値）。
#
# 入力するのは、Dot または担当者が問い合わせ通知メールで確認・分類した「確定済みの週次集計値」だけ。
# 氏名・会社名・メールアドレス・本文などの個人情報は書かない（件数のみ）。
# Googleスプレッドシート「問い合わせ一覧」は商談・受注の台帳で、フォーム送信全件の記録ではないため、
# 送信総数の代わりに使わない。
#
# 書き方:
#   - 1週 = 1項目。start / end は週次レポートの対象期間と同じ7日間（例: 2026-10-18〜2026-10-24）。
#   - 件数はすべて0以上の整数。0件の週も 0 と書く（項目がない週は「未入力」と表示し、累計にも含めない）。
#   - general_total（一般問い合わせ）= project_consultation + sales_solicitation + other になること（生成時に検査する）。
#   - 分類はフォームの選択項目ではなく、本文の実態で判断する。判断が難しいものは other に入れ、
#     other_needs_review（その他のうち要確認）にも数える。
#   - 通知メールへの返信は件数に含めない。専用採用フォームは recruiting_form に別集計する。
#
# 項目:
#   general_total        一般問い合わせフォームの実送信数
#   project_consultation うち案件相談（顧客からの依頼・相談。SEO/AIO施策の最終的な成果指標）
#   sales_solicitation   うち売り込み・提携勧誘（営業、外注先・販売パートナーとしての売り込みを含む）
#   other                うちその他（採用応募・アンケートなど。要確認を含む）
#   other_needs_review   その他のうち、分類の判断が難しく要確認のもの
#   recruiting_form      専用採用フォームの送信数（一般問い合わせとは別集計）
#   confirmed_by         確認・分類した人
#   note                 確認方法などの注記（個人情報は書かない）
weeks:
  - start: "2026-10-18"
    end: "2026-10-24"
    general_total: 10
    project_consultation: 0
    sales_solicitation: 8
    other: 2
    other_needs_review: 0
    recruiting_form: 1
    confirmed_by: "Dot"
    note: "問い合わせ通知メールから確認（返信7通を除外）。サーバー側の未着分は未確認。"
