# パイプライン実行設定（対象期間の決定・GA4セグメント定義）
#
# コードに固定値を埋め込まず、本ファイルを参照する（thresholds.yamlと同じ方針）。

gsc:
  data_cutoff:
    # auto（2026-11-02〜）: レポート週＝前週の月〜日（日本時間。GA4・問い合わせの対象期間）。
    #   GSCは「確定済みの最新7日間」。希望末日はレポート週の日曜から end_offset_days 日前（2＝金曜）で、
    #   Search Console API（dataState=all）の firstIncompleteDate より前に収まらない場合は前にずらして注記する。
    #   月曜朝の時点でGSCの土・日は未確定のため（2026-11-02実測）。日付はSearch Consoleの基準（米国太平洋時間）。
    # fixed（〜2026-10-30の旧方式）: 実行日から offset_days 日を引いた日を末日とする7日間（GSC・GA4共通）。
    mode: auto
    end_offset_days: 2
    # 確定の遅れがこれを超える場合は、期間がレポート週と大きくずれるため生成しない（失敗として通知）
    max_shift_days: 6
    offset_days: 3
  report_period:
    length_days: 7
  compare_period: previous_7_days

ga4:
  property_id: "269009748"
  # 集計対象のホスト名（2026-11-16週〜）。GA4のすべての集計をこのホスト名に絞る。
  # ステージング（sg2026.tcd.jp、?ga_debug=1 のとき本番プロパティに送る仕様）とバックアップ環境（bk2025.tcd.jp）の
  # アクセスが同じプロパティに入っているため（2026-09-14〜11-08 で約200セッション・全体の約1.7%）。
  # 空にすると絞らない（変更前と同じ）。
  hostnames: ["tcd.jp", "www.tcd.jp"]
  # ① の到達ユーザー（GA4 の activeUsers）。期間中にその条件に合うページを1回以上表示したユーザー数。
  # 複数セグメントにまたがって数えるため、合計してもサイト全体と一致しない。
  #
  # 条件（2026-11-23週〜）: GA4 の pagePath（クエリ文字列を含まない）を、exact（完全一致）か prefix（前方一致）で判定する。
  # 2026-11-16週までは pagePathPlusQueryString の部分一致（path_contains）だったため、次の混入・欠落があった
  # （2026-08-01〜11-15 の実データで確認）:
  #   - 「/service/」: /service（トップ。期間中3,639人）を含まず、/works/service/* を含んでいた
  #   - 「/works/」: /works（トップ。1,287人）を含まなかった
  #   - 「/contact」: /b2b/contact と、確認・完了画面（/contact_confirm・/contact_end）を含んでいた
  #   - 「/download」: /b2b/download と /branding/03-news/download.html（記事）を含んでいた
  # 部分一致（path_contains）は旧データの再現用に読み込めるが、新しいセグメントには使わない。
  segments:
    - key: site_wide
      label: サイト全体
      rule_label: すべてのページ
    - key: magazine
      label: マガジン到達
      rule_label: /branding と /branding/ 以下
      legacy_path_contains: "/branding/"   # 旧定義（2026-11-16週まで）。移行期間の比較表示用
      exact: ["/branding"]
      prefix: ["/branding/"]
    - key: works
      label: Works到達
      rule_label: /works と /works/ 以下
      legacy_path_contains: "/works/"   # 旧定義（2026-11-16週まで）。移行期間の比較表示用
      exact: ["/works"]
      prefix: ["/works/"]
    - key: service
      label: Service到達
      rule_label: /service と /service/ 以下
      legacy_path_contains: "/service/"   # 旧定義（2026-11-16週まで）。移行期間の比較表示用
      exact: ["/service"]
      prefix: ["/service/"]
    - key: contact
      label: 問い合わせフォーム到達（一般）
      rule_label: /contact（入力画面のみ）
      legacy_path_contains: "/contact"   # 旧定義（2026-11-16週まで）。移行期間の比較表示用
      exact: ["/contact", "/contact/", "/contact/index.html"]
      group: cv
    - key: b2b_contact
      label: 問い合わせフォーム到達（BtoB）
      rule_label: /b2b/contact（入力画面のみ）
      exact: ["/b2b/contact", "/b2b/contact/"]
      group: cv
    - key: document_request
      label: 資料請求ページ到達（一般）
      rule_label: /download（入力画面のみ）
      legacy_path_contains: "/download"   # 旧定義（2026-11-16週まで）。移行期間の比較表示用
      exact: ["/download", "/download/"]
      group: cv
    - key: b2b_document_request
      label: 資料請求ページ到達（BtoB）
      rule_label: /b2b/download（入力画面のみ）
      exact: ["/b2b/download", "/b2b/download/"]
      group: cv

  # 流入元の区分（2026-11-23週〜）。GA4 の sessionSourceMedium（「参照元 / メディア」）ごとのセッション数を、
  # 上から順に判定して1つの区分に入れる（生成AI → 広告 → 自然検索 → 直接 → 参照元 → その他・不明）。
  # セッション数は区分の合計がサイト全体と一致する（ユーザー数は区分をまたいで重複するため、区分別には出さない）。
  channels:
    # 広告: メディアがこの正規表現に全体一致するもの（大文字小文字を区別しない）。
    # 2026-11 に確認した値: universe / cpc（キャンペーン tcdleedcv）、google / cpc（TCD_企業認知 ほか）
    ad_medium_regex: "(cpc|ppc|cpm|cpv|cpa|paid.*|display|banner|retargeting)"
    # 生成AI: 参照元が sources のいずれかに全体一致（正規表現・大文字小文字を区別しない）するもの。
    # 一致しなくても、メディアが include_mediums（GA4 が生成AIと分類したもの）なら「その他の生成AI」に入れる。
    # Google（AI Overview・AIモード）と Bing（Copilot 検索を含む）は通常の検索と区別できないため、自然検索に入れる。
    ai:
      include_mediums: ["ai-assistant"]
      services:
        - label: ChatGPT
          sources: ['chatgpt\.com', 'chat\.openai\.com', 'openai', 'chatgpt']
        - label: Perplexity
          sources: ['(www\.)?perplexity\.ai', 'perplexity']
        - label: Gemini
          sources: ['gemini\.google\.com', 'bard\.google\.com', 'gemini']
        - label: Claude
          sources: ['claude\.ai', 'claude']
        - label: Copilot
          sources: ['copilot\.com', 'copilot\.microsoft\.com', 'copilot\.cloud\.microsoft', 'copilot']
        - label: DeepSeek
          sources: ['chat\.deepseek\.com', 'deepseek']
        - label: Grok
          sources: ['grok\.com', 'grok']
        - label: Mistral
          sources: ['chat\.mistral\.ai']
        - label: Poe
          sources: ['poe\.com']
        - label: Felo
          sources: ['felo\.ai']
        - label: Genspark
          sources: ['genspark\.ai']
  # 推移表の週数（当週を含む。月〜日の週＝GA4 の isoYearIsoWeek）。セグメント別の推移も同じ週数で、
  # 過去の週も含めてすべて現在の条件（exact・prefix）で取り直す。
  trend_weeks: 8
  # 集計条件の変更（2026-11-23週〜）の移行期間。レポート週の末日がこの日以前の週だけ、legacy_path_contains（旧定義）
  # での当週の値も取得し、新旧の差をレポートに注記する。
  legacy_comparison_until: "2026-12-13"

# 問い合わせ実績（② 問い合わせ実績）の取得元（2026-11-02〜）。
# Dot が集計した週次件数を Google スプレッドシート（TCD Workspace）に1週1行で記録し、パイプラインが読み取る。
# スプレッドシートIDは .env の INQUIRY_SHEET_ID（Gitに入れない）。未設定・取得失敗でもレポート生成は止めない（「未集計」と表示）。
# config_v2/inquiries.yaml は手入力の代替・訂正用で、値がある週はスプレッドシートより優先する。
inquiries:
  source: sheets
  sheet_id_env: INQUIRY_SHEET_ID
  range: "weekly!A1:Z"  # 列名で読む。フォーム区分の列（N列以降）を足しても読めるよう Z まで
